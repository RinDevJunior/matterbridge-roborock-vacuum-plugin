name: Publish to npm

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rehearse the PR comment for (always a dry run, posts nothing)'
        required: true
        type: string

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # needed for npm trusted publishing (OIDC)
  actions: read

jobs:
  publish-release:
    name: Publish release to npm
    if: github.event_name == 'release' && github.event.release.prerelease == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Verify Node.js version
        run: node -v

      - name: Verify Npm version
        run: npm -v

      - name: Clone matterbridge repo branch main
        run: npm run precondition

      - name: Install plugin dependencies
        run: npm ci --no-fund --no-audit

      - name: Link matterbridge in the project
        run: npm link matterbridge --no-fund --no-audit

      - name: Build the plugin
        run: npm run build

      - name: Lint the plugin
        run: npm run lint

      - name: Test the plugin
        run: npm run test

      - name: Publish to npm with trusted publishing / OIDC
        run: npm publish --provenance --access public --tag latest

  publish-release-candidate:
    name: Publish release candidate to npm
    if: github.event_name == 'release' && github.event.release.prerelease == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Verify Node.js version
        run: node -v

      - name: Verify Npm version
        run: npm -v

      - name: Install matterbridge
        run: npm run precondition

      - name: Install plugin dependencies
        run: npm ci --no-fund --no-audit

      - name: Link matterbridge in the project
        run: npm link matterbridge --no-fund --no-audit

      - name: Build the plugin
        run: npm run build

      - name: Lint the plugin
        run: npm run lint

      - name: Test the plugin
        run: npm run test

      - name: Publish to npm with trusted publishing / OIDC
        run: npm publish --provenance --access public --tag dev

  announce-release:
    name: Comment released PRs
    needs: [publish-release, publish-release-candidate]
    if: ${{ github.event_name == 'release' && !cancelled() && (needs.publish-release.result == 'success' || needs.publish-release-candidate.result == 'success') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Comment on released PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          DRY_RUN: 'false'
        run: node scripts/release-comment.mjs

  announce-dry-run:
    name: Dry run only - log released PR comments, post nothing
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Resolve release type
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: echo "PRERELEASE=$(gh release view "$TAG" --repo "$GH_REPO" --json isPrerelease --jq .isPrerelease)" >> "$GITHUB_ENV"

      - name: Dry-run PR comments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: 'true'
        run: node scripts/release-comment.mjs
